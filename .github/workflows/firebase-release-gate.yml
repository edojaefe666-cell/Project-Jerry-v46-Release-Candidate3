name: Jerry Firebase Release Gate

on:
  workflow_dispatch:

jobs:
  firebase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract v46 release candidate
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No release-candidate ZIP found."
            exit 1
          fi

          echo "Using release candidate: $ZIP"
          mkdir -p release-candidate
          unzip -q "$ZIP" -d release-candidate

          PACKAGE_JSON="$(find release-candidate -type f -name package.json | head -n 1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: No package.json found inside release candidate."
            find release-candidate -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_JSON")"
          echo "Jerry project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: bun install --frozen-lockfile

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.JERRY_FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Verify real Firebase authentication and revocation
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          JERRY_FIREBASE_INTEGRATION: "1"
          JERRY_FIREBASE_PROJECT_ID: ${{ secrets.JERRY_FIREBASE_PROJECT_ID }}
          JERRY_FIREBASE_WEB_API_KEY: ${{ secrets.JERRY_FIREBASE_WEB_API_KEY }}
          JERRY_FIREBASE_TEST_EMAIL: ${{ secrets.JERRY_FIREBASE_TEST_EMAIL }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_APPLICATION_CREDENTIALS" || {
            echo "Google Application Default Credentials were not configured."
            exit 1
          }
          test -s "$GOOGLE_APPLICATION_CREDENTIALS" || {
            echo "Federated credential configuration file is missing or empty."
            exit 1
          }
          bun run test:firebase
