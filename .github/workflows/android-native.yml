name: Jerry Android Native Verification

on:
  pull_request:
    paths:
      - "android-native/**"
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-native.yml"
  push:
    branches:
      - "reconcile/jerry-owner-only-auth"
    paths:
      - "android-native/**"
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

# Avoid wasting runner time on superseded APK candidates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build Jerry web UI for Android asset origin
        env:
          VITE_BASE_PATH: "/public/"
          VITE_API_BASE_URL: ${{ vars.JERRY_BACKEND_ORIGIN || 'https://jerry-backend.invalid' }}
        run: |
          node --input-type=module -e '
            const value = process.env.VITE_API_BASE_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.username || url.password ||
                url.pathname !== "/" || url.search || url.hash) {
              throw new Error("JERRY_BACKEND_ORIGIN must be a clean HTTPS origin.");
            }
            console.log("Android backend origin:", url.origin);
          '
          bun run build
          mkdir -p android-native/app/src/main/assets/public
          cp -R dist/. android-native/app/src/main/assets/public/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug and unsigned release APKs, run unit tests and lint
        working-directory: android-native
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > app/build/outputs/apk/release/app-release-unsigned.apk.sha256

      - name: Smoke test Jerry on an Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android-native && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Publish Android build candidates and SHA-256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: jerry-android-candidates-${{ github.sha }}
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/debug/app-debug.apk.sha256
            android-native/app/build/outputs/apk/release/app-release-unsigned.apk
            android-native/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 14
