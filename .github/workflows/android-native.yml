name: Jerry Android Native Verification

on:
  pull_request:
    paths:
      - "android-native/**"
      - "src/**"
      - "scripts/**"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-native.yml"
  push:
    branches:
      - "reconcile/jerry-owner-only-auth"
    paths:
      - "android-native/**"
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

# Avoid wasting runner time on superseded APK candidates.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Test connected Android release configuration guard
        run: node --test scripts/verify-android-connected-release.test.mjs

      # Connected signed releases are opt-in and require owner-managed GitHub
      # Variables/Secrets. Diagnostic debug and unsigned APK builds stay free.
      - name: Verify connected release configuration and prepare signing keystore
        if: vars.JERRY_CONNECTED_RELEASE == 'true'
        env:
          JERRY_BACKEND_ORIGIN: ${{ vars.JERRY_BACKEND_ORIGIN }}
          JERRY_FIREBASE_PROJECT_ID: ${{ vars.JERRY_FIREBASE_PROJECT_ID }}
          JERRY_GOOGLE_WEB_CLIENT_ID: ${{ vars.JERRY_GOOGLE_WEB_CLIENT_ID }}
          JERRY_ANDROID_KEYSTORE_BASE64: ${{ secrets.JERRY_ANDROID_KEYSTORE_BASE64 }}
          JERRY_ANDROID_KEY_ALIAS: ${{ secrets.JERRY_ANDROID_KEY_ALIAS }}
          JERRY_ANDROID_STORE_PASSWORD: ${{ secrets.JERRY_ANDROID_STORE_PASSWORD }}
          JERRY_ANDROID_KEY_PASSWORD: ${{ secrets.JERRY_ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$JERRY_ANDROID_KEYSTORE_BASE64" || { echo "Missing JERRY_ANDROID_KEYSTORE_BASE64 secret."; exit 1; }
          echo "::add-mask::$JERRY_ANDROID_KEY_ALIAS"
          echo "::add-mask::$JERRY_ANDROID_STORE_PASSWORD"
          echo "::add-mask::$JERRY_ANDROID_KEY_PASSWORD"
          export JERRY_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/jerry-release.jks"
          printf '%s' "$JERRY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$JERRY_ANDROID_KEYSTORE_FILE"
          test -s "$JERRY_ANDROID_KEYSTORE_FILE"
          echo "JERRY_ANDROID_KEYSTORE_FILE=$JERRY_ANDROID_KEYSTORE_FILE" >> "$GITHUB_ENV"
          node scripts/verify-android-connected-release.mjs

      - name: Build Jerry web UI for Android asset origin
        env:
          VITE_BASE_PATH: "/public/"
          VITE_API_BASE_URL: ${{ vars.JERRY_BACKEND_ORIGIN || 'https://jerry-backend.invalid' }}
        run: |
          node --input-type=module -e '
            const value = process.env.VITE_API_BASE_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.username || url.password ||
                url.pathname !== "/" || url.search || url.hash) {
              throw new Error("JERRY_BACKEND_ORIGIN must be a clean HTTPS origin.");
            }
            console.log("Android backend origin:", url.origin);
          '
          bun run build
          mkdir -p android-native/app/src/main/assets/public
          cp -R dist/. android-native/app/src/main/assets/public/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug and release APKs, run unit tests and lint
        working-directory: android-native
        env:
          JERRY_ANDROID_KEY_ALIAS: ${{ secrets.JERRY_ANDROID_KEY_ALIAS }}
          JERRY_ANDROID_STORE_PASSWORD: ${{ secrets.JERRY_ANDROID_STORE_PASSWORD }}
          JERRY_ANDROID_KEY_PASSWORD: ${{ secrets.JERRY_ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -name 'app-release*.apk' -print -quit)"
          test -n "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"

      # Publish compiled candidates even if the emulator smoke test fails, so
      # a device-installable diagnostic build is not lost with the test result.
      - name: Publish Android build candidates and SHA-256 checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerry-android-candidates-${{ github.sha }}
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/debug/app-debug.apk.sha256
            android-native/app/build/outputs/apk/release/*.apk
            android-native/app/build/outputs/apk/release/*.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke test Jerry on an Android 10 emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            adb wait-for-device
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "29"
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.projectjerry.android/.ui.MainActivity
            sleep 5
            adb shell pidof com.projectjerry.android

