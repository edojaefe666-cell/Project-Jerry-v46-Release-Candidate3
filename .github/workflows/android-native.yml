name: Jerry Android Native Verification

on:
  pull_request:
    paths:
      - "android-native/**"
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-native.yml"
  push:
    branches:
      - "reconcile/jerry-owner-only-auth"
    paths:
      - "android-native/**"
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build Jerry web UI for Android asset origin
        env:
          VITE_BASE_PATH: "/public/"
          VITE_API_BASE_URL: "https://jerry-backend.invalid"
        run: |
          bun run build
          mkdir -p android-native/app/src/main/assets/public
          cp -R dist/. android-native/app/src/main/assets/public/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK, run unit tests and lint
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
