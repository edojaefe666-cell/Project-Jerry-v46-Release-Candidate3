name: Jerry CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jerry_test
          POSTGRES_PASSWORD: jerry_test
          POSTGRES_DB: jerry_tenant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jerry_test -d jerry_tenant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Check release dependency lock consistency
        run: bun run check:release-lock
      - run: bun install --frozen-lockfile
      - name: Prepare disposable PostgreSQL schema
        env:
          SQL_HOST: 127.0.0.1
          SQL_USER: jerry_test
          SQL_PASSWORD: jerry_test
          SQL_DB_NAME: jerry_tenant_test
          SQL_ADMIN_USER: jerry_test
          SQL_ADMIN_PASSWORD: jerry_test
        run: bun run db:test:push
      - name: Dedicated PostgreSQL double-entry journal gate
        env:
          NODE_ENV: test
          JERRY_JOURNAL_TEST_DATABASE: "1"
          JERRY_PROVIDER_LEDGER_TEST_DATABASE: "1"
          SQL_HOST: 127.0.0.1
          SQL_USER: jerry_test
          SQL_PASSWORD: jerry_test
          SQL_DB_NAME: jerry_tenant_test
        run: node --import tsx --test src/db/journal.integration.test.ts
      - name: Dedicated PostgreSQL tenant-isolation gate
        env:
          NODE_ENV: test
          JERRY_TENANT_TEST_DATABASE: "1"
          JERRY_JOURNAL_TEST_DATABASE: "1"
          SQL_HOST: 127.0.0.1
          SQL_USER: jerry_test
          SQL_PASSWORD: jerry_test
          SQL_DB_NAME: jerry_tenant_test
        run: bun run test:tenant
      - name: Release verification
        env:
          NODE_ENV: test
          JERRY_TENANT_TEST_DATABASE: "1"
          JERRY_JOURNAL_TEST_DATABASE: "1"
          SQL_HOST: 127.0.0.1
          SQL_USER: jerry_test
          SQL_PASSWORD: jerry_test
          SQL_DB_NAME: jerry_tenant_test
        run: bun run verify:release
